
name: Expo CI

on:
  push:
    branches:
      - main
      - feature/login

  pull_request:
    branches:
      - main
      - feature/login

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. VALIDATION
  # ==========================================
  validate:
    name: Validate Expo Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Expo Configuration
        run: npx expo config --type public

      - name: Build Web
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-web
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. ANDROID BUILD
  # ==========================================
  android-build:
    name: Build Android
    runs-on: ubuntu-latest

    needs: validate

    # Android build only on push, not on PR.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          set -euo pipefail

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > android-build.json

          echo "EAS build completed."

          cat android-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android APK
        run: |
          set -euo pipefail

          BUILD_ID=$(jq -er '.[0].id // .id' android-build.json)

          echo "Build ID: $BUILD_ID"

          mkdir -p artifacts/android

          eas build:download \
            --id "$BUILD_ID" \
            --path artifacts/android/messenger.apk

          test -s artifacts/android/messenger.apk

          echo "APK downloaded successfully:"
          ls -lh artifacts/android/messenger.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android
          path: artifacts/android/messenger.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 3. GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android-build

    # Release only from main.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: messenger-android
          path: release/

      - name: Verify Release APK
        run: |
          set -euo pipefail

          test -s release/messenger.apk

          echo "Release APK:"
          ls -lh release/messenger.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release/messenger.apk
