
name: Expo CI

on:
  push:
    branches:
      - main
      - feature/login

  pull_request:
    branches:
      - main
      - feature/login

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. VALIDATION
  # ==========================================
  validate:
    name: Validate Expo Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Expo Configuration
        run: npx expo config --type public

      - name: Build Web
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-web
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. ANDROID + IOS BUILD
  # ==========================================
  native-build:
    name: Build Android and iOS
    runs-on: ubuntu-latest

    needs: validate

    # Не собираем нативные приложения на PR.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > android-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --wait \
            --json > ios-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android APK
        run: |
          BUILD_ID=$(jq -r '.[0].id // .id' android-build.json)

          mkdir -p artifacts/android

          eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          APK=$(find . -maxdepth 2 -name '*.apk' -not -path './artifacts/*' | head -n 1)

          test -n "$APK"
          cp "$APK" artifacts/android/messenger.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download iOS IPA
        run: |
          BUILD_ID=$(jq -r '.[0].id // .id' ios-build.json)

          mkdir -p artifacts/ios

          eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          IPA=$(find . -maxdepth 2 -name '*.ipa' -not -path './artifacts/*' | head -n 1)

          test -n "$IPA"
          cp "$IPA" artifacts/ios/messenger.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android
          path: artifacts/android/messenger.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-ios
          path: artifacts/ios/messenger.ipa
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 3. GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs: native-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: messenger-android
          path: release/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: messenger-ios
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/messenger.apk
            release/messenger.ipa
