
name: Expo CI

on:
  push:
    branches:
      - main
      - feature/login

  pull_request:
    branches:
      - main
      - feature/login

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. VALIDATION
  # ==========================================
  validate:
    name: Validate Expo Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Expo Configuration
        run: npx expo config --type public

      - name: Build Web
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-web
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. MAESTRO ANDROID TESTS
  # ==========================================
  maestro-tests:
    name: Maestro Android Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Install Maestro CLI
        run: |
          curl --fail --location --silent --show-error https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.12.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/maestro-ci.sh

  # ==========================================
  # 3. ANDROID BUILD
  # ==========================================
  android-build:
    name: Build Android
    runs-on: ubuntu-latest

    needs: validate

    # Не собираем Android на Pull Request.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > android-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android APK
        run: |
          set -euo pipefail
          BUILD_ID=$(jq -er '.[0].id // .id' android-build.json)
          echo "Build ID: $BUILD_ID"

          mkdir -p artifacts/android

          DOWNLOAD_RESULT=$(eas build:download \
            --build-id "$BUILD_ID" \
            --json)
          APK=$(printf '%s' "$DOWNLOAD_RESULT" | jq -er '.path')
          test -s "$APK"
          cp "$APK" artifacts/android/messenger.apk
          test -s artifacts/android/messenger.apk
          echo "APK downloaded successfully:"
          ls -lh artifacts/android/messenger.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android
          path: artifacts/android/messenger.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 4. GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs: android-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: messenger-android
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/messenger.apk
